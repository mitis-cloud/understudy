name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (envtest)
        run: make test
      - name: Test startup without Argo Rollouts
        run: ARGO_ROLLOUTS_CRD= go test ./internal/controller -ginkgo.focus='Optional Rollout API'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build manager
        run: make build
      - name: Verify generated code is committed
        run: |
          make manifests generate
          git diff --exit-code || (echo "::error::generated files are stale; run 'make manifests generate'" && exit 1)

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Helm lint + template
        run: |
          helm lint charts/understudy
          helm template smoke charts/understudy > /dev/null
      - name: Chart metadata tracks appVersion
        run: make chart-check
      - name: Binaries accept the chart's args
        run: make chart-args-check
